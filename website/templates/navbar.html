<!-- voy a usar CSS inline para dejar el mensaje 'Bienvenido User' y el link de logout en la misma linea -->
<style>
  .user-info-container {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  
  .user-info-inline {
    display: inline-flex;
    align-items: center;
    gap: 15px;
  }
</style>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'home' %}">Django</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        {% if user.is_authenticated %}
          <li class="nav-item">
            <div>
              <div class="user-info-container">
                <span class="nav-link p-0">Welcome, {{ user.username }} || </span>
                <a class="nav-link p-0" href="{% url 'logout' %}">Logout</a>
              </div>
            </div>
          </li>
        {% else %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'register' %}">Register</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'home' %}">Login</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
